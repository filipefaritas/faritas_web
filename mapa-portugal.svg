<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Mapa de Portugal</title>
  <desc id="map-desc">Mapa de Portugal continental com marcações no Porto, Lisboa e Algarve.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132a3d"/>
      <stop offset="1" stop-color="#0a1d2c"/>
    </linearGradient>

    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1b36f"/>
      <stop offset="1" stop-color="#8d8056"/>
